name: Refresh App Store Profiles

# Manual signing-maintenance workflow. This runs on a hosted macOS runner so
# no local Mac is required. It force-refreshes the Match profile after an App
# ID capability change, then pushes the encrypted profile to the private Match
# repository. It does not build or upload the app.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh App Store provisioning profile
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Force-refresh Match profile
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY:     ${{ secrets.ASC_API_KEY }}
          APPLE_TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTIFIER:  ${{ secrets.APP_IDENTIFIER }}
          MATCH_GIT_URL:   ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          set -o pipefail
          bundle exec fastlane refresh_profiles 2>&1 | tee fastlane_refresh_profiles_output.txt

      - name: Upload Fastlane logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-refresh-profiles-logs
          path: |
            fastlane_refresh_profiles_output.txt
            fastlane/report.xml
          retention-days: 7
