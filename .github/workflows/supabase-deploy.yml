name: Supabase Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.112.0

      # Migration steps are best-effort (continue-on-error) since they need
      # `supabase link` which is broken (CLI rejects +00:00 timezone on
      # Migrations use psql with explicit IPv4 (libpq hostaddr trick).
      # Direct DB hostname refuses IPv6 from GitHub Actions runners (ECONNREFUSED
      # on AAAA records) and the connection pooler returns "tenant/user not found"
      # (not enabled for this project). Forcing IPv4 via socket.gethostbyname
      # bypasses both issues.
      #
      # Marking 20260722190336 as applied (was broken on this DB) and applying the
      # two migrations silently skipped since the link broke on 2026-08-07:
      #   - 20260808153000_add_gpt56_models.sql (model catalog seeds)
      #   - 20260809200500_add_scene_memory_layers.sql (5 jsonb columns, PR #304)
      # Both use IF NOT EXISTS / ON CONFLICT so re-applying is safe.
      - name: Mark broken migration 20260722190336 as applied
        continue-on-error: true
        run: |
          DB_HOSTNAME="db.${SUPABASE_PROJECT_REF}.supabase.co"
          DB_IPV4=$(python3 -c "import socket; print(socket.gethostbyname('$DB_HOSTNAME'))")
          echo "Connecting to $DB_HOSTNAME (IPv4: $DB_IPV4)..."
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=$DB_HOSTNAME hostaddr=$DB_IPV4 port=5432 user=postgres dbname=postgres sslmode=require" \
            -c "insert into supabase_migrations.schema_migrations (version, name, statements) values ('20260722190336', 'reconcile_tombstone_linked_project_aliases', '{}') on conflict (version) do nothing"
      - name: Run database migrations via psql
        run: |
          DB_HOSTNAME="db.${SUPABASE_PROJECT_REF}.supabase.co"
          DB_IPV4=$(python3 -c "import socket; print(socket.gethostbyname('$DB_HOSTNAME'))")
          echo "Connecting to $DB_HOSTNAME (IPv4: $DB_IPV4)..."
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=$DB_HOSTNAME hostaddr=$DB_IPV4 port=5432 user=postgres dbname=postgres sslmode=require" \
            -v ON_ERROR_STOP=1 -f supabase/migrations/20260808153000_add_gpt56_models.sql
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=$DB_HOSTNAME hostaddr=$DB_IPV4 port=5432 user=postgres dbname=postgres sslmode=require" \
            -v ON_ERROR_STOP=1 -f supabase/migrations/20260809200500_add_scene_memory_layers.sql

      # Clean up the manual "kevbot" service_role API key (one-time cleanup).
      # Created 2026-07-26 via dashboard; not part of the normal key set.
      # Idempotent: 404 after first run is ignored.
      - name: Remove kevbot service_role API key (cleanup)
        continue-on-error: true
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys/007e3ab3-7294-4f10-962f-c1f8ea1d0aed" \
            || echo "(kevbot key already removed)"

      - name: Deploy Edge Function - generate-story
        if: ${{ hashFiles('supabase/functions/generate-story/index.ts') != '' }}
        run: supabase functions deploy generate-story --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - sync-storekit-entitlement
        if: ${{ hashFiles('supabase/functions/sync-storekit-entitlement/index.ts') != '' }}
        run: supabase functions deploy sync-storekit-entitlement --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - app-store-server-notification
        if: ${{ hashFiles('supabase/functions/app-store-server-notification/index.ts') != '' }}
        run: supabase functions deploy app-store-server-notification --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - get-credit-state
        if: ${{ hashFiles('supabase/functions/get-credit-state/index.ts') != '' }}
        run: supabase functions deploy get-credit-state --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - admin-grant-credits
        if: ${{ hashFiles('supabase/functions/admin-grant-credits/index.ts') != '' }}
        run: supabase functions deploy admin-grant-credits --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - backend-health
        if: ${{ hashFiles('supabase/functions/backend-health/index.ts') != '' }}
        run: supabase functions deploy backend-health --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - generation-models
        if: ${{ hashFiles('supabase/functions/generation-models/index.ts') != '' }}
        run: supabase functions deploy generation-models --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - public-sharing
        if: ${{ hashFiles('supabase/functions/public-sharing/index.ts') != '' }}
        run: supabase functions deploy public-sharing --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy Edge Function - outline-from-recipe
        if: ${{ hashFiles('supabase/functions/outline-from-recipe/index.ts') != '' }}
        run: supabase functions deploy outline-from-recipe --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy Edge Function - embed-section
        if: ${{ hashFiles('supabase/functions/embed-section/index.ts') != '' }}
        run: supabase functions deploy embed-section --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - sync-story-arc
        if: ${{ hashFiles('supabase/functions/sync-story-arc/index.ts') != '' }}
        run: supabase functions deploy sync-story-arc --project-ref "$SUPABASE_PROJECT_REF"
