name: Supabase Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Skip broken pre-existing migration (mark applied)
        run: |
          supabase migration repair \
            --status applied \
            20260722190336
      - name: Run database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Function - generate-story
        if: ${{ hashFiles('supabase/functions/generate-story/index.ts') != '' }}
        run: supabase functions deploy generate-story --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - sync-storekit-entitlement
        if: ${{ hashFiles('supabase/functions/sync-storekit-entitlement/index.ts') != '' }}
        run: supabase functions deploy sync-storekit-entitlement --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - app-store-server-notification
        if: ${{ hashFiles('supabase/functions/app-store-server-notification/index.ts') != '' }}
        run: supabase functions deploy app-store-server-notification --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - get-credit-state
        if: ${{ hashFiles('supabase/functions/get-credit-state/index.ts') != '' }}
        run: supabase functions deploy get-credit-state --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - admin-grant-credits
        if: ${{ hashFiles('supabase/functions/admin-grant-credits/index.ts') != '' }}
        run: supabase functions deploy admin-grant-credits --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - backend-health
        if: ${{ hashFiles('supabase/functions/backend-health/index.ts') != '' }}
        run: supabase functions deploy backend-health --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - generation-models
        if: ${{ hashFiles('supabase/functions/generation-models/index.ts') != '' }}
        run: supabase functions deploy generation-models --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - public-sharing
        if: ${{ hashFiles('supabase/functions/public-sharing/index.ts') != '' }}
        run: supabase functions deploy public-sharing --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy Edge Function - outline-from-recipe
        if: ${{ hashFiles('supabase/functions/outline-from-recipe/index.ts') != '' }}
        run: supabase functions deploy outline-from-recipe --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy Edge Function - run-outline
        if: ${{ hashFiles('supabase/functions/run-outline/index.ts') != '' }}
        run: supabase functions deploy run-outline --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Function - embed-section
        if: ${{ hashFiles('supabase/functions/embed-section/index.ts') != '' && success() }}
        run: supabase functions deploy embed-section --project-ref "$SUPABASE_PROJECT_REF"

      # PR-4100-C: per-user ownership enforcement + 5-min signed URL for the
      # iOS read path. JWT-verified (no --no-verify-jwt) — caller must present
      # the user's own JWT, and the function checks exported_by_user_id == auth.uid()
      # before issuing the signed URL.
      - name: Deploy Edge Function - export-epub-download
        if: ${{ hashFiles('supabase/functions/export-epub-download/index.ts') != '' && success() }}
        run: supabase functions deploy export-epub-download --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - sync-story-arc
        if: ${{ hashFiles('supabase/functions/sync-story-arc/index.ts') != '' }}
        run: supabase functions deploy sync-story-arc --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function - coherence-check
        # Added 2026-08-17: PR #361 ships new coherence-check logic (extends
        # .select() to include character_deltas + continuity_facts + scene
        # state, rewords system prompt to lead with character-state checks).
        # Was missing from this workflow, so the prior deploy run went green
        # but never pushed the new logic live. Without this step every
        # coherence-check fix is a no-op until someone manually redeploys.
        if: ${{ hashFiles('supabase/functions/coherence-check/index.ts') != '' }}
        run: supabase functions deploy coherence-check --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Function - export-epub
        # Added 2026-08-25: PR-4100-A Kindle export backend (merge 7012059,
        # folded into PR-4100-B merge 3a77e37) was never listed here, so
        # the smoke test caught a 404 NOT_FOUND when iOS called
        # /functions/v1/export-epub. Without this step every PR-4100-A
        # or PR-4100-B deploy is a no-op for the export path.
        if: ${{ hashFiles('supabase/functions/export-epub/index.ts') != '' }}
        run: supabase functions deploy export-epub --project-ref "$SUPABASE_PROJECT_REF"
