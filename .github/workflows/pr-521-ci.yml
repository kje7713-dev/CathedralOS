name: PR-521 Deno CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/generate-story/**'
      - 'supabase/functions/embed-section/**'
      - 'supabase/functions/run-outline/**'
      - 'supabase/functions/outline-from-recipe/**'
      - 'supabase/functions/sync-openai-model-catalog/**'
      - 'supabase/functions/sync-openai-pricing/**'
      - 'supabase/functions/sync-openai-admin-usage/**'
      - 'supabase/migrations/20260919100000_openai_admin_usage_reconciliation.sql'
      - 'supabase/tests/database/openai_admin_usage_reconciliation.test.sql'
      - 'supabase/migrations/20260919110000_schedule_openai_admin_usage.sql'
      - 'supabase/migrations/20260920230000_schedule_openai_catalog_and_pricing.sql'
      - 'supabase/tests/database/openai_catalog_pricing_schedulers.test.sql'
      - 'supabase/migrations/20260919070000_openai_pricing_observations.sql'
      - 'supabase/tests/database/openai_pricing_observations.test.sql'
      - 'supabase/migrations/20260920100000_retire_legacy_model_rates.sql'
      - 'supabase/tests/database/legacy_model_rates_retirement.test.sql'
      - 'supabase/migrations/20260909215722_scene_memory_stage_ledger_and_run_lineage.sql'
      - 'supabase/migrations/20260917190000_generation_model_pricing_safety.sql'
      - 'supabase/migrations/20260917200000_sync_openai_model_catalog.sql'
      - 'supabase/tests/database/scene_memory_stage_ledger.test.sql'
      - 'supabase/tests/database/openai_model_catalog_sync.test.sql'
      # PR #609: provider_billing_unavailable non-retryable fix
      - 'supabase/functions/_shared/_operator_alert.ts'
      - 'supabase/functions/_shared/_operator_alert_test.ts'
      - 'supabase/migrations/20260921092700_provider_billing_alerts.sql'
      - 'supabase/tests/database/provider_billing_alerts.test.sql'
      - '.github/workflows/pr-521-ci.yml'

jobs:
  deno-check-and-tests:
    name: Deno check + PR-521 scene-memory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Type check production sources
        run: >-
          deno check
          supabase/functions/_shared/billable-llm.ts
          supabase/functions/_shared/scene-memory.ts
          supabase/functions/_shared/memory-lifecycle.ts
          supabase/functions/_shared/memory-pipeline.ts
          supabase/functions/_shared/memory-state.ts
          supabase/functions/_shared/section-embedding.ts
          supabase/functions/_shared/_operator_alert.ts
          supabase/functions/embed-section/index.ts
          supabase/functions/generate-story/_provider.ts
          supabase/functions/generate-story/index.ts
      - name: Test Responses structured output and cache preservation
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/_provider_test.ts
          --filter="Responses structured output preserves cache boundary"
      # PR #609 v2: full _provider_test.ts run. The previous --filter
      # "provider billing-unavailable" matched 0 tests and was removed;
      # whole-file run executes all 13+ tests (6 spec-required classifier
      # cases + provider-level mocked OpenAI 429 for both Responses +
      # chat/completions paths + the canonical predicates).
      - name: Full generate-story/_provider_test.ts (provider billing-unavailable contract)
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/_provider_test.ts
      - name: Test parser, truncation, semantic contract, and indexing regressions
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="single-pass scene response parser"
      - name: Test semantic scene-memory contract and public trust boundary
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="scene-memory contract"
      - name: Test generated-section indexing wiring
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="PR-360-Z regression A"

      - name: Test lifecycle, pipeline, and Run All behavioral regressions
        run: >-
          deno test --no-check -A
          supabase/functions/_shared/memory-lifecycle_test.ts
          supabase/functions/_shared/memory-pipeline_test.ts
          supabase/functions/run-outline/index_test.ts

      # PR #609 v2: full run-outline/index_test.ts is already run by the
      # "Test lifecycle, pipeline, and Run All behavioral regressions" step
      # above. New billing-terminal tests (generation-stage,
      # memory-stage, real provider_rate_limited preserved) added to that
      # file are exercised by the whole-file run. The previous --filter
      # "provider_billing_unavailable terminal" matched 0 tests and was
      # removed.

      # PR #609: operator alert module (Resend + dedupe + sanitization)
      - name: Test operator alert module
        run: >-
          deno test --no-check -A
          supabase/functions/_shared/_operator_alert_test.ts

      # PR #609 v2: embed-section billing-unavailable HTTP-boundary test
      # (full embed-section/index_test.ts run — new test added for the
      # billing-unavailable friendly 503 + alert-firing surface path).
      - name: Full embed-section/index_test.ts (billing-unavailable HTTP-boundary)
        run: >-
          deno test --no-check -A
          supabase/functions/embed-section/index_test.ts

      - name: Test outline worker lifecycle and checkpoint recovery
        run: >-
          deno test --no-check -A
          supabase/functions/outline-from-recipe/index_test.ts


      - name: Type check PR2 OpenAI catalog sync sources
        run: >-
          deno check
          supabase/functions/sync-openai-model-catalog/_handler.ts
          supabase/functions/sync-openai-model-catalog/index.ts

      - name: Test PR2 OpenAI catalog sync handler and parser
        run: >-
          deno test --no-check -A
          supabase/functions/sync-openai-model-catalog/index_test.ts

      - name: Type check and test official pricing observer
        run: >-
          deno check
          supabase/functions/sync-openai-pricing/index.ts
          supabase/functions/sync-openai-pricing/_handler.ts
          supabase/functions/sync-openai-pricing/_parser.ts
          && deno test --no-check -A
          supabase/functions/sync-openai-pricing/index_test.ts

      - name: Type check and test OpenAI admin usage sync
        run: >-
          deno check
          supabase/functions/sync-openai-admin-usage/index.ts
          supabase/functions/sync-openai-admin-usage/_auth.ts
          supabase/functions/sync-openai-admin-usage/_handler.ts
          && deno test --no-check -A
          supabase/functions/sync-openai-admin-usage/index_test.ts
          supabase/functions/sync-openai-admin-usage/auth_test.ts

  pricing-database-regression:
    name: Pricing observation pgTAP regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Start disposable Supabase database and apply migrations
        run: |
          # This historical repair migration uses transaction-scoped LOCK TABLE,
          # but the current CLI executes migration statements outside a
          # transaction during reset. It has no schema dependency for this empty
          # database; omit only this data-repair file in the disposable checkout
          # before the CLI starts, without rewriting the committed migration.
          repair_migration="supabase/migrations/20260722190336_reconcile_tombstone_linked_project_aliases.sql"
          lineage_migration="supabase/migrations/20260821120000_add_generation_output_id_to_section_embeddings.sql"
          repair_backup="$(mktemp)"
          lineage_backup="$(mktemp)"
          cp "$repair_migration" "$repair_backup"
          cp "$lineage_migration" "$lineage_backup"
          cleanup() {
            cp "$repair_backup" "$repair_migration"
            cp "$lineage_backup" "$lineage_migration"
            rm -f "$repair_backup" "$lineage_backup" "$repair_migration.tmp" "$lineage_migration.tmp"
          }
          trap cleanup EXIT
          printf '%s\n' '-- Historical data-repair migration omitted from empty disposable reset.' > "$repair_migration.tmp"
          mv "$repair_migration.tmp" "$repair_migration"
          {
            printf '%s\n' 'alter table public.section_embeddings add column if not exists generation_output_id uuid;'
            cat "$lineage_migration"
          } > "$lineage_migration.tmp"
          mv "$lineage_migration.tmp" "$lineage_migration"
          supabase start
          supabase db reset --local --yes
      - name: Run pricing observation pgTAP test
        run: >-
          supabase db test --local
          supabase/tests/database/openai_pricing_observations.test.sql
      - name: Run admin usage reconciliation pgTAP test
        run: >-
          supabase db test --local
          supabase/tests/database/openai_admin_usage_reconciliation.test.sql
      - name: Run catalog and pricing scheduler pgTAP test
        run: >-
          supabase db test --local
          supabase/tests/database/openai_catalog_pricing_schedulers.test.sql
      - name: Run PR5 legacy pricing retirement pgTAP test
        run: >-
          supabase db test --local
          supabase/tests/database/legacy_model_rates_retirement.test.sql
      # PR #609: provider_billing_alerts dedupe + outcome telemetry
      - name: Run provider_billing_alerts pgTAP test
        run: >-
          supabase db test --local
          supabase/tests/database/provider_billing_alerts.test.sql
