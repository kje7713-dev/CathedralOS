name: PR-521 Deno CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/generate-story/**'
      - 'supabase/functions/embed-section/**'
      - 'supabase/functions/run-outline/**'
      - 'supabase/migrations/20260909215722_scene_memory_stage_ledger_and_run_lineage.sql'
      - 'supabase/tests/database/scene_memory_stage_ledger.test.sql'
      - '.github/workflows/pr-521-ci.yml'

jobs:
  deno-check-and-tests:
    name: Deno check + PR-521 scene-memory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Type check production sources
        run: >-
          deno check
          supabase/functions/_shared/billable-llm.ts
          supabase/functions/_shared/scene-memory.ts
          supabase/functions/_shared/memory-lifecycle.ts
          supabase/functions/_shared/memory-pipeline.ts
          supabase/functions/_shared/memory-state.ts
          supabase/functions/_shared/section-embedding.ts
          supabase/functions/embed-section/index.ts
          supabase/functions/generate-story/_provider.ts
          supabase/functions/generate-story/index.ts
      - name: Test Responses structured output and cache preservation
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/_provider_test.ts
          --filter="Responses structured output preserves cache boundary"
      - name: Test parser, truncation, semantic contract, and indexing regressions
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="single-pass scene response parser"
      - name: Test semantic scene-memory contract and public trust boundary
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="scene-memory contract"
      - name: Test generated-section indexing wiring
        run: >-
          deno test --no-check -A
          supabase/functions/generate-story/index_test.ts
          --filter="PR-360-Z regression A"

      - name: Test lifecycle, pipeline, and Run All behavioral regressions
        run: >-
          deno test --no-check -A
          supabase/functions/_shared/memory-lifecycle_test.ts
          supabase/functions/_shared/memory-pipeline_test.ts
          supabase/functions/run-outline/index_test.ts
