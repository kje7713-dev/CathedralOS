name: Release Guards

on:
  pull_request:
    paths:
      - ".github/workflows/supabase-deploy.yml"
      - "scripts/verify-supabase-deploy-coverage.py"
      - "scripts/test_verify-supabase-deploy-coverage.py"
      - "supabase/functions/**/index.ts"

permissions:
  contents: read

jobs:
  supabase-deploy-coverage:
    name: Supabase deploy coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test deployment coverage guard
        run: python3 scripts/test_verify-supabase-deploy-coverage.py
      - name: Verify deployment coverage
        run: python3 scripts/verify-supabase-deploy-coverage.py
